version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: POSTGRES_USER
      POSTGRES_PASSWORD: POSTGRES_PASSWORD
      POSTGRES_DB: POSTGRES_DB
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  auth-service:
    build: ./auth-service
    ports:
      - "3001:3000"
    environment:
      DATABASE_URL: DATABASE_URL
    depends_on:
      - postgres

  events-service:
    build: ./events-service
    ports:
      - "3002:3000"
    environment:
      DATABASE_URL: DATABASE_URL
    depends_on:
      - postgres

volumes:
  postgres_data: